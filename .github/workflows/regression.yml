name: regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run deterministic scorer smoke test
        run: echo '{"same_pickup":1}' | python tools/deterministic_scorer.py
