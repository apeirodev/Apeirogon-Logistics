name: validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.11'

      - name: Install dev dependencies
        run: pip install --require-hashes -r ../requirements-dev.txt

      - name: Audit dependencies for known CVEs
        run: pip-audit --requirement ../requirements-dev.txt

      - name: Run pytest suite
        run: python -m pytest tests/ -v --tb=short

      - name: Validate JSON schemas
        run: |
          python tools/schema_validator.py --root schema | python -c "import json,sys; d=json.load(sys.stdin); assert d['valid'], d; print('schemas valid:', d['file_count'])"

      - name: Validate manifests
        run: |
          python tools/manifest_validator.py --root manifests --base . | python -c "import json,sys; d=json.load(sys.stdin); assert d['valid'], d; print('manifests valid:', d['manifest_count'])"
          python tools/manifest_validator.py --root . --base . --exclude "tests/*" | python -c "import json,sys; d=json.load(sys.stdin); assert d['valid'], d; print('root manifests valid:', d['manifest_count'])"

      - name: Check SETUP file scoring block sync
        run: python tools/sync_setup_scoring.py --check

      - name: Validate scoring numbers match config
        run: python tools/validate_scoring_numbers.py | python -c "import json,sys; d=json.load(sys.stdin); assert d['valid'], d; print('scoring numbers valid:', d['check_count'], 'checks')"

      - name: Check player uploads match canonical sources
        run: python tools/sync_player_uploads.py --check
