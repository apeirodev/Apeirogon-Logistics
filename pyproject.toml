[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "apeirogon-logistics"
version = "0.41.7"
description = "Deterministic operational intelligence for Star Citizen hauling"
requires-python = ">=3.10"
license = {text = "CC BY-NC 4.0"}
dependencies = []

[tool.pytest.ini_options]
testpaths = ["developer/tests"]
pythonpath = ["developer/tools"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["developer/tools"]
