[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "apeirogon-logistics"
version = "0.30.5"
description = "Deterministic operational intelligence for Star Citizen hauling"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["tools"]
